<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigment 13</title>
</head>
<body>
    <h2>Circle SVG</h2>
    <svg width="200" height="200">
        <circle cx="100" cy="100" r="80" stroke="black" stroke-width="2" fill="red" />
    </svg>

    <h2>Rectangle SVG</h2>
    <svg width="200" height="200">
        <rect x="10" y="10" width="180" height="180" stroke="black" stroke-width="2" fill="blue" />
    </svg>

    <h2>Triangle SVG</h2>
    <svg width="200" height="200">
        <polygon points="100,10 190,190 10,190" stroke="black" stroke-width="2" fill="green" />
    </svg>

    
    <h2>Ellipse SVG</h2>
    <svg width="200" height="200">
        <ellipse cx="100" cy="100" rx="80" ry="50" stroke="black" stroke-width="2" fill="purple" />
    </svg>
</body>
</html>
